[framework]
;browser_path = C:\Program Files\Google\Chrome\Application\chrome.exe
browser_path =
log_path = logs
report_path = reports
cache_path = cache
;allure 报告工具路径（外部工具，与框架解耦，不随框架打包）：
;留空 = 自动查找（PATH 上的 allure 命令，或用户目录 ~/.just-go/allure/*/bin，由 just-go install allure 安装）
;填写 = 使用指定路径（绝对路径直接使用；相对路径基于框架根解析，兼容旧配置）
allure_path =

[run]
slow_time = 500
show_browser = True
;浏览器类型：chromium / firefox / webkit（默认 chromium）
browser_type = chromium
;登录态复用（可选）：留空不启用；填写 storage_state 文件路径（相对路径基于测试项目根），
;启动浏览器时自动加载该登录态。保存方式：登录用例内执行
;   page.context.storage_state(path="state.json")
;或在 conftest.py 里用 config.run.storage_state = "state.json" 覆盖。
storage_state =
;录屏统一使用系统 ffmpeg 抓取桌面（Windows 用 gdigrab，Linux 用 x11grab），产出 mp4；
;需已安装 ffmpeg（just-go install ffmpeg）
