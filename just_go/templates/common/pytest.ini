[pytest]
addopts=
    -s
    --color=auto
    --no-header
    --import-mode=importlib
    # 默认开启录屏（ffmpeg 桌面录屏，产出 mp4 自动附到报告；需系统已安装 ffmpeg）；不需要可删除本行
    --record=yes
    # 失败重试：失败用例自动重试 1 次（间隔 1 秒）；改为 0 或删除即关闭；
    # 单独控制某用例：@pytest.mark.flaky(reruns=3, reruns_delay=2)
    --reruns=1
    --reruns-delay=1
console_output_style = count
testpaths = cases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
