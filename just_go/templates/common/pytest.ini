[pytest]
addopts=
    -s
    --color=auto
    --no-header
    --import-mode=importlib
    # 默认开启录屏
    --record=yes
    # 失败重试：失败用例自动重试 1 次（间隔 1 秒）；改为 0 或删除即关闭；
    # 单独控制某用例：@pytest.mark.flaky(reruns=3, reruns_delay=2)
    --reruns=1
    --reruns-delay=1
    # 报告生成模式：yes=单文件，no=目录模式
    --report-single-mode=yes
console_output_style = count
testpaths = cases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
