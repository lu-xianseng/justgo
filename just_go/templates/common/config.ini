;测试项目级配置：只写需要改的项，没写的沿用框架默认值。
;框架自带默认在 site-packages 的 just_go/configs/config.ini，那份不用动。
;这里取消注释并填值即可生效（改完需重启进程）。

[framework]
;浏览器可执行文件路径（不写 = 使用 Playwright 自带浏览器）
;browser_path =

;allure 报告工具路径（不写 = 自动查找 PATH 与 ~/.just-go/allure）
;allure_path =

;录屏编码器路径（不写 = 自动查找 PATH 与 ~/.just-go/ffmpeg）
;ffmpeg_path =

;报告标题（不写 = 被测项目名）；报告语言（不写 = zh）
;report_name =
;report_language = zh

[run]
;操作慢速等待毫秒数（不写 = 500）
;slow_time = 500

;是否显示浏览器窗口（不写 = True）
;show_browser = True

;浏览器类型 chromium / firefox / webkit（不写 = chromium）
;browser_type = chromium

;登录态复用：填 storage_state 文件路径（相对路径基于本项目根）
;storage_state =
