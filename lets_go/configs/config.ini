[framework]
;browser_path = C:\Program Files\Google\Chrome\Application\chrome.exe
browser_path =
log_path = logs
report_path = reports
cache_path = cache
;allure 报告工具路径（外部工具，与框架解耦，不随框架打包）：
;留空 = 自动查找（PATH 上的 allure 命令，或用户目录 ~/.lets-go/allure/*/bin，由 lets-go install allure 安装）
;填写 = 使用指定路径（绝对路径直接使用；相对路径基于框架根解析，兼容旧配置）
allure_path =

[run]
slow_time = 500
show_browser = True
;录屏后端：playwright（默认，轻量，无需ffmpeg，产出webm）/ ffmpeg（抓桌面，需安装ffmpeg，产出mp4/webm）
record_backend = playwright
