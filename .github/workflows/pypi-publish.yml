# GitHub Actions：打 tag 自动构建并发布到 PyPI（Trusted Publishing 可信发布）
#
# 用法：
#   1. 改好 pyproject.toml 版本号（每次发布必须递增，如 0.1.2 -> 0.1.3）
#   2. 打 tag 并推送：
#        git tag v0.1.3
#        git push origin v0.1.3
#   3. 本工作流自动构建 wheel + sdist 并上传 PyPI，无需任何账号密码
#
# 前置：需在 PyPI 项目页配置 trusted publisher（发布者 = lu-xianseng / 仓库 = justgo
#       / 工作流文件名 = pypi-publish.yml / 环境名留空），详见项目 README 或 PyPI 文档。
#       注意：项目首次在 PyPI 发布时必须手动 twine upload 一次，之后才能启用可信发布。

name: publish-pypi

on:
  push:
    tags:
      - "v*"        # 匹配 v0.1.0 / v1.2.3 等版本 tag
  workflow_dispatch:  # 也可手动触发

permissions:
  contents: read
  id-token: write     # 关键：OIDC 身份令牌，供 PyPI 验证本次构建确实来自本仓库

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 跳过已存在同名版本的发布：避免重复打相同 tag 时上传失败
          skip-existing: true
          # 如需先发布到测试源验证，可临时把下面一行取消注释（并把上一行注释掉）
          # repository-url: https://test.pypi.org/legacy/
