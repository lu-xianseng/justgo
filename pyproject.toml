[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lets-go"
version = "0.1.0"
description = "Web 自动化测试框架：以命令方式指定测试项目执行自动化测试"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.3.4",
    "pytest-rerunfailures",
    "allure-python-commons>=2.13.5",
    "allure-pytest>=2.13.5",
    "loguru>=0.7.3",
    "faker",
    "requests",
    "playwright",
]

[project.scripts]
lets-go = "cli:main"

[tool.setuptools]
packages = ["lets_go"]
py-modules = ["cli"]

# 配置文件属于框架资源，必须随包安装（默认只打包 .py 文件）
[tool.setuptools.package-data]
lets_go = ["configs/*.ini"]
