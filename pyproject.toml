[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "just-go"
version = "0.1.8"
description = "Web 自动化测试框架：框架与测试代码分离，一条命令指定测试项目执行自动化测试并产出报告"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "luye", email = "1173381395@qq.com" },
]
keywords = [
    "testing",
    "automation",
    "web-ui-testing",
    "api-testing",
    "playwright",
    "pytest",
    "allure",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=8.3.4",
    "pytest-rerunfailures",
    "allure-python-commons>=2.13.5",
    "allure-pytest>=2.13.5",
    "loguru>=0.7.3",
    "faker",
    "requests",
    "playwright",
]

[project.urls]
Homepage = "https://github.com/lu-xianseng/justgo"
Repository = "https://github.com/lu-xianseng/justgo"

[project.scripts]
just-go = "cli:main"

[tool.setuptools]
packages = ["just_go"]
py-modules = ["cli"]

# 配置文件与 init 骨架模板属于框架资源，必须随包安装（默认只打包 .py 文件）
[tool.setuptools.package-data]
just_go = [
    "configs/*.ini",
    "templates/common/*",
    "templates/common/cases/*",
    "templates/gui/*",
    "templates/gui/cases/module/*",
    "templates/gui/pages/*",
    "templates/gui/tag/*",
    "templates/api/*",
    "templates/api/apis/*",
    "templates/api/cases/api/*",
    "templates/api/tag/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["just_go/templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
