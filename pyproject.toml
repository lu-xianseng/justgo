[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "just-go"
version = "0.3.4"
description = "Web 自动化测试框架：框架与测试代码分离，一条命令指定测试项目执行自动化测试并产出报告"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "luye", email = "1173381395@qq.com" },
]
keywords = [
    "testing",
    "automation",
    "web-ui-testing",
    "api-testing",
    "playwright",
    "pytest",
    "allure",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "playwright",
    "pipenv",
    "loguru",
    "allure-python-commons",
    # HTTP 封装（just_go.http）与报告环境信息（PlaywrightVersion/RequestsVersion）
    # 都依赖 requests；漏声明时干净环境会在生成报告阶段抛 PackageNotFoundError
    "requests",
    # 数据 mock（just_go.data 的 mock）依赖 faker
    "faker",
]

# 图像识别（屏幕找图）是可选能力：只有装了 just-go[image] 才会带上
# opencv / numpy / mss 这些较重的依赖，不装也不影响框架本身的导入与运行。
[project.optional-dependencies]
image = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "mss>=9.0; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/lu-xianseng/justgo"
Repository = "https://github.com/lu-xianseng/justgo"

[project.scripts]
just-go = "just_go.cli:main"

[tool.setuptools]
packages = ["just_go", "just_go._internal", "just_go._internal.image"]

# 配置文件与 init 骨架模板属于框架资源，必须随包安装（默认只打包 .py 文件）
[tool.setuptools.package-data]
just_go = [
    "configs/*.ini",
    "templates/common/*",
    "templates/common/.*",
    "templates/common/cases/*",
    "templates/gui/*",
    "templates/gui/cases/login/*",
    "templates/gui/pages/*",
    "templates/gui/pages/*/*",
    "templates/gui/tag/*",
    "templates/api/*",
    "templates/api/apis/*",
    "templates/api/cases/api/*",
    "templates/api/tag/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["just_go/templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
