[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lets-go"
version = "0.1.0"
description = "Web 自动化测试框架：以命令方式指定测试项目执行自动化测试"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.3.4",
    "pytest-rerunfailures",
    "allure-python-commons>=2.13.5",
    "allure-pytest>=2.13.5",
    "loguru>=0.7.3",
    "faker",
    "requests",
    "playwright",
]

# 旧测试项目的历史依赖（测试代码直接 import，非框架必需）：lets-go install legacy 安装
[project.optional-dependencies]
legacy = [
    "jsonpath",
    "redis",
    "selenium",
    "pycryptodome",
]

[project.scripts]
lets-go = "cli:main"

[tool.setuptools]
packages = ["lets_go"]
py-modules = ["cli"]
